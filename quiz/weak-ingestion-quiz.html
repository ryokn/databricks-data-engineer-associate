<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弱点対策: Data Ingestion and Loading(10問)</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6678; --line:#d9dde5;
  --accent:#2563eb; --accent-soft:#e3ecff; --ok:#15803d; --ok-soft:#dcfce7;
  --ng:#b91c1c; --ng-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --card:#1b202b; --text:#e8ebf2; --muted:#9aa3b5; --line:#2e3545;
    --accent:#7aa2ff; --accent-soft:#22304f; --ok:#4ade80; --ok-soft:#14301f;
    --ng:#f87171; --ng-soft:#3a1c1c; --warn:#fbbf24; --warn-soft:#35280f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.4rem;margin:8px 0 4px}
h2{font-size:1.1rem;margin:0 0 12px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.between{justify-content:space-between}
label.opt-line{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
select,input[type=number]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);
  padding:9px 16px;border-radius:10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0}
.tag{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.multi{background:var(--warn-soft);color:var(--warn)}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{color:var(--ng)}
.scenario{background:var(--bg);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0;white-space:pre-wrap}
.q{font-size:1.05rem;margin:10px 0 14px;white-space:pre-wrap}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;
  padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.choice .mark{flex:none;width:22px;height:22px;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;border-radius:50%}
.choice.multi .mark{border-radius:5px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.sel .mark{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--ng);background:var(--ng-soft)}
.choice.missed{border-style:dashed;border-color:var(--ok)}
.fb{margin-top:14px;padding:14px;border-radius:10px;white-space:pre-wrap}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.ng{background:var(--ng-soft);border:1px solid var(--ng)}
.fb b.h{display:block;margin-bottom:4px}
code{background:var(--bg);border:1px solid var(--line);padding:0 5px;border-radius:5px;font-size:.92em}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nav button{padding:4px 10px;font-size:.85rem;min-width:38px}
.nav button.cur{border-color:var(--accent);background:var(--accent-soft)}
.nav button.done{border-color:var(--ok)}
.nav button.flag{border-color:var(--warn);background:var(--warn-soft)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.big{font-size:2.2rem;font-weight:700}
.pass{color:var(--ok)} .fail{color:var(--ng)}
.hidden{display:none}
.muted{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* __QUIZ_DATA__ は build_quiz.py が問題データで置き換える */
const QUIZ = {"meta": {"title": "弱点対策: Data Ingestion and Loading(10問)", "exam": "Databricks Certified Data Engineer Associate(弱点分野の練習)", "passing_score": 0.7, "time_limit_minutes": 15, "storage_key": "dea-weak-ingestion"}, "questions": [{"id": "a001", "domain": "Data Ingestion and Loading", "question": "クラウドストレージに毎日新しい JSON ファイルが追加される。新しいファイルだけを増分で取り込みたい。最も適した方法はどれか。", "options": ["毎回 `spark.read.json` で全ファイルを読み込み、テーブルを上書きする", "Auto Loader(`cloudFiles`)を `readStream` で使う", "外部 DB に JDBC で接続して全件を取得する", "ノートブックで手作業でファイルを一覧し、1つずつ読み込む"], "answer": [1], "explanation": "Auto Loader は、ストレージに到着した新しいファイルを検知し、処理済みのファイルを記録しながら増分で取り込む。`spark.read.json` で毎回全件を読むと増分処理にならず、処理時間も増える。JDBC は外部 DB 向けで、ファイルの増分取り込みには使わない。手作業の読み込みは再現性がなく、運用に向かない。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a002", "domain": "Data Ingestion and Loading", "question": "`COPY INTO` を同じ入力パスとテーブルに対して毎晩再実行した。どうなるか。", "options": ["すべてのファイルを再度読み込み、行が重複する", "テーブルが自動で TRUNCATE されてから全件を読み込む", "すでに読み込まれたファイルはスキップされ、新しいファイルだけが取り込まれる", "2回目以降の実行は必ずエラーで失敗する"], "answer": [2], "explanation": "`COPY INTO` は、どのファイルを読み込んだかを記録しているため、再実行しても既存のファイルは取り込まない(冪等)。すべて再読み込みすると重複行が生まれるため、それは誤り。TRUNCATE は行われない。2回目以降も正常に動くため、必ず失敗するという説明も誤り。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a003", "domain": "Data Ingestion and Loading", "question": "Auto Loader で `cloudFiles.schemaLocation` を指定する目的として正しいものはどれか。", "options": ["推論されたスキーマと、その更新内容を保存する", "処理済みファイルの一覧を保存する", "書き込み先テーブルの保存場所を指定する", "一時ファイルを置くためのフォルダを指定する"], "answer": [0], "explanation": "`schemaLocation` には、Auto Loader が推論したスキーマと、スキーマ進化で更新された内容が保存される。処理の進捗は `writeStream` の `checkpointLocation` に記録する。出力先テーブルは `toTable` などで指定するもので、`schemaLocation` とは関係ない。一時ファイルの置き場所でもない。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a004", "domain": "Data Ingestion and Loading", "question": "`writeStream` の `checkpointLocation` の役割はどれか。", "options": ["読み込むファイルの場所を指定する", "スキーマの変更を許可するかどうかを決める", "データを重複排除するキーを指定する", "処理の進捗と状態を保存し、失敗後に続きから再開できるようにする"], "answer": [3], "explanation": "チェックポイントには、どこまで処理したかと集約などの状態が保存される。そのため、ストリームが失敗しても、保存された地点から再開できる。読み込み先は `load` のパスで指定する。スキーマ進化は `schemaEvolutionMode` で制御する。重複排除のキーはクエリ側で指定する。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a005", "domain": "Data Ingestion and Loading", "question": "`cloudFiles.inferColumnTypes` を指定しない場合、JSON の数値の列はどの型として扱われるか。", "options": ["整数型(BIGINT)", "文字列型(STRING)", "倍精度浮動小数点型(DOUBLE)", "ファイルごとに自動で判定される型"], "answer": [1], "explanation": "既定では、推論されたスキーマの列は文字列として扱われる。数値・真偽値・タイムスタンプとして推論させるには `inferColumnTypes` を `true` にする。数値型に固定されるわけではなく、ファイルごとに型が変わることもない。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a006", "domain": "Data Ingestion and Loading", "question": "`cloudFiles.schemaEvolutionMode` を `rescue` にした。スキーマにない列の値はどこに入るか。", "options": ["取り込みが失敗し、そのファイルは処理されない", "テーブルのスキーマに自動で列が追加される", "`_rescued_data` 列に JSON 形式で退避される", "破棄され、どこにも残らない"], "answer": [2], "explanation": "`rescue` モードでは、スキーマにない列や、スキーマと型が合わない値を `_rescued_data` 列に退避する。スキーマは変わらず、ストリームも止まらない。列が自動で追加されるのは `addNewColumns` の動作。何も残さないのは `none` モードの動作。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a007", "domain": "Data Ingestion and Loading", "question": "Auto Loader で、スキーマ推論を使わずに列と型を明示して読み込みたい。最も適した方法はどれか。", "options": ["`.schema()` で列と型を明示的に指定する", "スキーマを毎回 `DESCRIBE` で取得して、ノートブックに貼り付ける", "`cloudFiles.schemaLocation` を削除する", "チェックポイントを削除して、スキーマを再度推論させる"], "answer": [0], "explanation": "`.schema()` で列と型を指定すると、推論を行わずにその定義で読み込める。`DESCRIBE` はテーブルの情報を表示するもので、ファイルの読み込み定義ではない。`schemaLocation` を削除しても型は固定されない。チェックポイントを削除すると進捗が失われ、最初から処理し直すことになる。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a008", "domain": "Data Ingestion and Loading", "question": "外部の PostgreSQL に JDBC で接続する。パスワードをノートブックに平文で書かずに済ませたい。最も適した方法はどれか。", "options": ["パスワードを `print` して、結果を別のセルにコピーする", "パスワードをノートブックのコメントに書いて、共有を制限する", "ワークスペースの共有フォルダに `.txt` で保存して読み込む", "`dbutils.secrets.get()` で Secret スコープから取得する"], "answer": [3], "explanation": "Secret スコープに認証情報を保存し、`dbutils.secrets.get()` で実行時に取得すると、コードに値が残らない。`print` で表示したり、コメントや共有フォルダに置いたりすると、漏えいの原因になる。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a009", "domain": "Data Ingestion and Loading", "question": "毎日の増分データを既存のテーブルに追加したい。既存の行は消したくない。`df.write` で指定するモードはどれか。", "options": ["overwrite", "append", "ignore", "errorifexists"], "answer": [1], "explanation": "`append` は既存の行を残したまま、新しい行を追加する。`overwrite` は既存の行を置き換えるため、過去のデータが消える。`ignore` は、テーブルが存在すると何もせずに終わる。`errorifexists` は、テーブルが存在するとエラーになる。", "note_ref": "要点メモ「Data Ingestion and Loading」"}, {"id": "a010", "domain": "Data Ingestion and Loading", "question": "`CREATE TABLE ... AS SELECT`(CTAS)の説明として正しいものはどれか。", "options": ["既存のテーブルの定義だけを複製し、データはコピーしない", "テーブルを作成するだけで、データは後から別の文で追加する", "クエリの結果からスキーマとデータを作成し、テーブルを新規作成する", "既存テーブルの行をすべて削除してから、クエリの結果を入れる"], "answer": [2], "explanation": "CTAS は、SELECT の結果からスキーマを決めてテーブルを作り、データも同時に書き込む。定義だけを複製するのは `CREATE TABLE ... LIKE` の動作。テーブル作成とデータ追加を別の文で行うわけではない。既存テーブルを置き換えるのは `CREATE OR REPLACE TABLE` などの別の操作。", "note_ref": "要点メモ「Data Ingestion and Loading」"}]};
</script>

<script>
(function(){
"use strict";
const META = QUIZ.meta || {};
const ALL = QUIZ.questions || [];
const PASS = typeof META.passing_score === "number" ? META.passing_score : 0.7;
const SKEY = "examkit:" + (META.storage_key || META.title || "default");
const $app = document.getElementById("app");
document.title = (META.title || "問題集");

/* ---------- 保存(使えない環境でも動くよう try/catch) ---------- */
function loadStore(){
  try{ const s = JSON.parse(localStorage.getItem(SKEY)||"null"); if(s) return s; }catch(e){}
  return {history:[], wrong:[], stats:{}};
}
function saveStore(){ try{ localStorage.setItem(SKEY, JSON.stringify(store)); }catch(e){} }
let store = loadStore();

/* ---------- ユーティリティ ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
/* 本文は一度エスケープしてから `code` だけを <code> にする(HTML注入を避ける) */
function fmt(s){ return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>"); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild; }
function same(a,b){ if(a.length!==b.length) return false; const x=a.slice().sort(), y=b.slice().sort(); return x.every((v,i)=>v===y[i]); }
function fmtTime(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }

/* ---------- 状態 ---------- */
let S = null;   // 出題中の状態
let tick = null;

/* ---------- スタート画面 ---------- */
function showStart(){
  clearInterval(tick); S=null;
  const domains = [...new Set(ALL.map(q=>q.domain||"全般"))];
  const wrongCount = store.wrong.filter(id=>ALL.some(q=>q.id===id)).length;
  const defTime = META.time_limit_minutes || Math.max(10, Math.round(ALL.length*1.5));
  $app.innerHTML = "";
  $app.appendChild(el(`<div>
    <h1>${esc(META.title||"問題集")}</h1>
    <p class="sub">${esc(META.exam||"")} ・ 全${ALL.length}問 ・ 合格目安 ${Math.round(PASS*100)}%</p>
    <div class="card">
      <h2>モード</h2>
      <label class="opt-line"><input type="radio" name="mode" value="practice" checked> 練習モード(1問ごとに採点と解説)</label>
      <label class="opt-line"><input type="radio" name="mode" value="exam"> 本番モード(タイマー付き・最後にまとめて採点)</label>
      <div class="row" style="margin-top:10px">
        <label>制限時間 <input type="number" id="mins" min="1" max="300" value="${defTime}" style="width:76px"> 分(本番モードのみ)</label>
      </div>
    </div>
    <div class="card">
      <h2>出題設定</h2>
      <div class="row">
        <label>分野 <select id="dom"><option value="*">すべて</option>${domains.map(d=>`<option>${esc(d)}</option>`).join("")}</select></label>
        <label>問題数 <input type="number" id="cnt" min="1" max="${ALL.length}" value="${ALL.length}" style="width:76px"></label>
      </div>
      <label class="opt-line"><input type="checkbox" id="shQ" checked> 問題の順番をシャッフル</label>
      <label class="opt-line"><input type="checkbox" id="shO" checked> 選択肢の順番をシャッフル</label>
    </div>
    <div class="row">
      <button class="primary" id="go">開始する</button>
      <button id="goWrong" ${wrongCount?"":"disabled"}>間違えた問題だけ再挑戦(${wrongCount}問)</button>
    </div>
    ${renderHistory()}
  </div>`));
  document.getElementById("go").onclick = ()=>{
    const mode = document.querySelector("input[name=mode]:checked").value;
    const dom = document.getElementById("dom").value;
    let pool = ALL.filter(q=> dom==="*" || (q.domain||"全般")===dom);
    if(document.getElementById("shQ").checked) pool = shuffle(pool);
    const n = Math.max(1, Math.min(pool.length, parseInt(document.getElementById("cnt").value,10)||pool.length));
    start(pool.slice(0,n), mode, document.getElementById("shO").checked, parseInt(document.getElementById("mins").value,10)||defTime);
  };
  document.getElementById("goWrong").onclick = ()=>{
    const pool = shuffle(ALL.filter(q=>store.wrong.includes(q.id)));
    start(pool, "practice", document.getElementById("shO").checked, defTime);
  };
}
function renderHistory(){
  if(!store.history.length) return "";
  const rows = store.history.slice(-8).reverse().map(h=>`<tr><td>${esc(h.date)}</td><td>${h.mode==="exam"?"本番":"練習"}</td><td>${h.correct}/${h.total}</td><td class="${h.rate>=PASS?"pass":"fail"}">${Math.round(h.rate*100)}%</td></tr>`).join("");
  const weak = {};
  ALL.forEach(q=>{ const st=store.stats[q.id]; if(!st) return; const d=q.domain||"全般"; weak[d]=weak[d]||{c:0,w:0}; weak[d].c+=st.c||0; weak[d].w+=st.w||0; });
  const wrows = Object.keys(weak).map(d=>{ const t=weak[d].c+weak[d].w; return t?`<tr><td>${esc(d)}</td><td>${weak[d].c}/${t}</td><td>${Math.round(weak[d].c/t*100)}%</td></tr>`:""; }).join("");
  return `<div class="card"><h2>これまでの結果</h2><table><tr><th>日時</th><th>モード</th><th>正解</th><th>正答率</th></tr>${rows}</table>
    ${wrows?`<h2 style="margin-top:18px">分野別の累計正答率</h2><table><tr><th>分野</th><th>正解</th><th>正答率</th></tr>${wrows}</table>`:""}
    <p style="margin-top:12px"><button id="reset">記録をリセット</button></p></div>`;
}
document.addEventListener("click", e=>{
  if(e.target && e.target.id==="reset" && confirm("保存した記録をすべて削除します。よろしいですか?")){
    store = {history:[], wrong:[], stats:{}}; saveStore(); showStart();
  }
});

/* ---------- 出題 ---------- */
function start(pool, mode, shuffleOpts, mins){
  if(!pool.length){ alert("出題できる問題がありません。"); return; }
  S = {
    mode, idx:0, mins,
    qs: pool.map(q=>({
      q, perm: shuffleOpts ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i),
      sel: [], done:false, flag:false, correct:null
    })),
    endAt: mode==="exam" ? Date.now()+mins*60000 : null
  };
  if(mode==="exam"){
    tick = setInterval(()=>{
      const left = Math.round((S.endAt-Date.now())/1000);
      const t = document.getElementById("timer");
      if(t){ t.textContent = fmtTime(left); t.classList.toggle("low", left<=300); }
      if(left<=0){ clearInterval(tick); finish(true); }
    },500);
  }
  renderQ();
}
function isCorrect(item){
  const picked = item.sel.map(d=>item.perm[d]);   // 表示位置 → 元の添字
  return same(picked, item.q.answer);
}
function renderQ(){
  const item = S.qs[S.idx], q = item.q, multi = q.answer.length>1;
  const exam = S.mode==="exam";
  const total = S.qs.length;
  const answered = S.qs.filter(x=> exam ? x.sel.length>0 : x.done).length;
  $app.innerHTML = "";
  const nav = S.qs.map((x,i)=>`<button data-i="${i}" class="${i===S.idx?"cur":""} ${(exam?x.sel.length:x.done)?"done":""} ${x.flag?"flag":""}">${i+1}</button>`).join("");
  const node = el(`<div>
    <div class="row between">
      <div><span class="muted">${S.idx+1} / ${total}</span> <span class="muted">・ ${exam?"本番":"練習"}</span></div>
      ${exam?`<div class="timer" id="timer">${fmtTime(Math.round((S.endAt-Date.now())/1000))}</div>`:`<button id="quit">中断</button>`}
    </div>
    <div class="bar" style="margin:8px 0"><i style="width:${answered/total*100}%"></i></div>
    <div class="nav">${nav}</div>
    <div class="card">
      <div><span class="tag">${esc(q.domain||"全般")}</span>${multi?`<span class="tag multi">${q.answer.length}つ選択</span>`:""}</div>
      ${q.scenario?`<div class="scenario">${fmt(q.scenario)}</div>`:""}
      <div class="q">${fmt(q.question)}</div>
      <div id="choices"></div>
      <div id="fb"></div>
    </div>
    <div class="row between">
      <div class="row">
        <button id="prev" ${S.idx===0?"disabled":""}>← 前へ</button>
        ${exam?`<button id="flag">${item.flag?"★ 見直しを外す":"☆ 見直しマーク"}</button>`:""}
      </div>
      <div class="row">
        ${exam?"":`<button class="primary" id="submit">回答する</button>`}
        <button id="next" class="${exam||item.done?"primary":""}">${S.idx===total-1?(exam?"採点へ":"結果を見る"):"次へ →"}</button>
      </div>
    </div>
  </div>`);
  $app.appendChild(node);

  const box = node.querySelector("#choices");
  item.perm.forEach((orig,d)=>{
    const b = document.createElement("button");
    b.className = "choice" + (multi?" multi":"");
    b.innerHTML = `<span class="mark"></span><span>${fmt(q.options[orig])}</span>`;
    b.dataset.d = d;
    b.onclick = ()=>{
      if(item.done) return;
      if(multi){ item.sel = item.sel.includes(d) ? item.sel.filter(x=>x!==d) : item.sel.concat(d); }
      else { item.sel = [d]; }
      paintChoices(node,item); refreshNavOnly(node);
    };
    box.appendChild(b);
  });
  paintChoices(node,item);
  if(item.done) showFeedback(node,item);

  node.querySelectorAll(".nav button").forEach(b=> b.onclick=()=>{ S.idx=parseInt(b.dataset.i,10); renderQ(); });
  node.querySelector("#prev").onclick = ()=>{ S.idx--; renderQ(); };
  node.querySelector("#next").onclick = ()=>{
    if(S.idx===total-1){
      if(exam){
        const un = S.qs.filter(x=>!x.sel.length).length;
        if(un && !confirm(`未回答が${un}問あります。このまま採点しますか?`)) return;
      } else if(S.qs.some(x=>!x.done) && !confirm("未回答の問題があります。このまま結果を見ますか?")) return;
      finish(false);
    } else { S.idx++; renderQ(); }
  };
  const sub = node.querySelector("#submit");
  if(sub){
    sub.disabled = item.done;
    sub.onclick = ()=>{
      if(!item.sel.length){ alert("選択肢を選んでください。"); return; }
      if(multi && item.sel.length!==q.answer.length && !confirm(`${q.answer.length}つ選ぶ問題ですが、${item.sel.length}つしか選んでいません。回答しますか?`)) return;
      item.done = true; item.correct = isCorrect(item);
      paintChoices(node,item); showFeedback(node,item); sub.disabled = true;
      node.querySelector("#next").classList.add("primary");
    };
  }
  const fl = node.querySelector("#flag");
  if(fl) fl.onclick = ()=>{ item.flag=!item.flag; renderQ(); };
  const qt = node.querySelector("#quit");
  if(qt) qt.onclick = ()=>{ if(confirm("中断してスタート画面に戻ります。この回の結果は保存されません。")) showStart(); };
}
function refreshNavOnly(node){
  node.querySelectorAll(".nav button").forEach((b,i)=>{
    const x=S.qs[i]; b.classList.toggle("done", S.mode==="exam" ? x.sel.length>0 : x.done);
  });
}
function paintChoices(node,item){
  const q=item.q;
  node.querySelectorAll(".choice").forEach(b=>{
    const d=parseInt(b.dataset.d,10), orig=item.perm[d], on=item.sel.includes(d), isAns=q.answer.includes(orig);
    b.classList.remove("sel","right","wrong","missed");
    b.querySelector(".mark").textContent = on ? "✓" : "";
    if(item.done){
      if(on && isAns) b.classList.add("right");
      else if(on && !isAns) b.classList.add("wrong");
      else if(!on && isAns) b.classList.add("missed");
    } else if(on) b.classList.add("sel");
  });
}
function showFeedback(node,item){
  const q=item.q, ok=item.correct;
  const ans = q.answer.slice().sort().map(o=>{ const d=item.perm.indexOf(o); return String.fromCharCode(65+d); }).sort().join("・");
  node.querySelector("#fb").innerHTML =
    `<div class="fb ${ok?"ok":"ng"}"><b class="h">${ok?"正解!":"不正解"}　正解: ${ans}</b>${fmt(q.explanation||"")}${q.note_ref?`<div class="muted" style="margin-top:8px">要点メモ: ${esc(q.note_ref)}</div>`:""}</div>`;
}

/* ---------- 結果 ---------- */
function finish(timeUp){
  clearInterval(tick);
  S.qs.forEach(x=>{ if(S.mode==="exam" || x.done){ x.correct = x.sel.length ? isCorrect(x) : false; } else { x.correct = false; } });
  const total=S.qs.length, correct=S.qs.filter(x=>x.correct).length, rate=correct/total;
  // 保存: 正誤の累計と、間違えた問題リスト
  S.qs.forEach(x=>{
    const id=x.q.id; const st=(store.stats[id] = store.stats[id]||{c:0,w:0});
    if(x.correct){ st.c++; store.wrong = store.wrong.filter(w=>w!==id); }
    else { st.w++; if(!store.wrong.includes(id)) store.wrong.push(id); }
  });
  store.history.push({date:new Date().toLocaleString("ja-JP"), mode:S.mode, correct, total, rate});
  store.history = store.history.slice(-50);
  saveStore();

  const byDom = {};
  S.qs.forEach(x=>{ const d=x.q.domain||"全般"; byDom[d]=byDom[d]||{c:0,t:0}; byDom[d].t++; if(x.correct) byDom[d].c++; });
  const drows = Object.keys(byDom).map(d=>`<tr><td>${esc(d)}</td><td>${byDom[d].c}/${byDom[d].t}</td><td>${Math.round(byDom[d].c/byDom[d].t*100)}%</td></tr>`).join("");
  const wrongs = S.qs.filter(x=>!x.correct);
  const wlist = wrongs.map(x=>{
    const q=x.q;
    const ans = q.answer.slice().sort().map(o=>fmt(q.options[o])).join(" / ");
    return `<div class="card"><span class="tag">${esc(q.domain||"全般")}</span>${q.scenario?`<div class="scenario">${fmt(q.scenario)}</div>`:""}
      <div class="q">${fmt(q.question)}</div>
      <div class="fb ng"><b class="h">正解: ${ans}</b>${fmt(q.explanation||"")}${q.note_ref?`<div class="muted" style="margin-top:8px">要点メモ: ${esc(q.note_ref)}</div>`:""}</div></div>`;
  }).join("");
  $app.innerHTML = "";
  const node = el(`<div>
    <h1>結果</h1>
    ${timeUp?`<p class="fail">制限時間になったため自動で採点しました。</p>`:""}
    <div class="card">
      <div class="big ${rate>=PASS?"pass":"fail"}">${Math.round(rate*100)}%　<span style="font-size:1.1rem">${correct} / ${total} 問正解</span></div>
      <p>${rate>=PASS?"合格ラインに到達しています。":"合格目安("+Math.round(PASS*100)+"%)に届いていません。下の復習から。"}</p>
      <table><tr><th>分野</th><th>正解</th><th>正答率</th></tr>${drows}</table>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="primary" id="retry" ${wrongs.length?"":"disabled"}>間違えた問題だけ再挑戦(${wrongs.length}問)</button>
      <button id="home">スタートに戻る</button>
    </div>
    ${wrongs.length?`<h2>復習: 間違えた問題</h2>${wlist}`:`<p>全問正解です。</p>`}
  </div>`);
  $app.appendChild(node);
  node.querySelector("#home").onclick = showStart;
  node.querySelector("#retry").onclick = ()=>{
    const pool = shuffle(wrongs.map(x=>x.q));
    start(pool, "practice", true, S.mins);
  };
  window.scrollTo(0,0);
}

showStart();
})();
</script>
</body>
</html>
